services:
  - type: web
    name: faultline-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_CONCURRENT_INFERENCE
        value: "1"
      - key: TORCH_NUM_THREADS
        value: "1"
      - key: DETECTOR_SCAN_STRIDE
        value: "100"
      - key: DETECTOR_BATCH_SIZE
        value: "8"
      - key: FORECAST_STEPS
        value: "180"
